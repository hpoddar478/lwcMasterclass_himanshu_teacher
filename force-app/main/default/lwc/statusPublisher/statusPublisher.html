<template>
    <div class="slds-card slds-p-around_small">
        <lightning-combobox name="progress" label="Select Agent Status" value={status} placeholder="Select Status"
            options={options} onchange={handleChange}>
        </lightning-combobox>

        <lightning-button variant="brand" label="Broadcast Status" title="Broadcast Status" onclick={publishStatus}
            class="slds-m-top_small"></lightning-button>
    </div>
</template>
