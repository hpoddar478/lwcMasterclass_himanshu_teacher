<template>
    <lightning-card title="User Information Form" icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <template if:true={errors.length}>
                <div class="error">
                    <p class="title">Please fix the following errors: </p>
                    <template for:each={errors} for:item="error">
                        <p key={error.fieldName}>{error.errorMessage}</p>
                    </template>
                </div>
            </template>

            <div class="slds-p-around_medium">
                <lightning-input label="Name" value={name} onchange={handleChange} data-field="name"
                    required></lightning-input>
                <lightning-input label="Email" type="email" value={email} data-field="email" onchange={handleChange}
                    required></lightning-input>
                <lightning-input label="Phone" type="tel" value={phone} data-field="phone"
                    onchange={handleChange}></lightning-input>
                <lightning-input label="Age" type="number" value={age} data-field="age"
                    onchange={handleChange}></lightning-input>

                <lightning-button variant="brand" label="Submit" title="Submit" onclick={handleSubmit}
                    class="slds-m-top_small"></lightning-button>
            </div>
        </div>
    </lightning-card>

</template>
